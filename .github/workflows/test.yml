name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  advisories:
    # Known vulnerabilities in the crates the workspace builds (RustSec), with the reasons for any
    # exception in deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo install --locked cargo-deny --version 0.22.1
      - name: cargo deny check advisories
        run: cargo deny --manifest-path rust/Cargo.toml --config deny.toml check advisories
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - name: Tests (and every vector in spec/vectors)
        working-directory: rust
        run: cargo test --locked
      - name: The standard and the code agree; the release manifest is current
        working-directory: rust
        run: cargo run --locked -p secure-net-tools -- standards && cargo run --locked -p secure-net-tools -- manifest --check
      - name: Lints (warnings are errors; unsafe code is forbidden in the core)
        working-directory: rust
        run: rustup component add clippy && cargo clippy --locked --all-targets -- -D warnings
      - name: Examples
        working-directory: rust
        run: cargo run --locked --example two_party && cargo run --locked --example social && cargo run --locked --example groups
      - name: wasm-bindgen (the CLI matching Cargo.lock)
        run: |
          version=$(awk '/name = "wasm-bindgen"/{getline; print $3}' rust/Cargo.lock | tr -d '"')
          cargo install --locked wasm-bindgen-cli --version "$version"
      - name: The WebAssembly build, tested under Node.js
        working-directory: rust
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked --target wasm32-unknown-unknown -p secure-net-wasm
      - name: The npm package builds and loads
        run: |
          cargo run --manifest-path rust/Cargo.toml --locked -p secure-net-tools -- package
          node -e 'const m = require("./pkg/node/secure_net_wasm.js"); const r = JSON.parse(m.call(JSON.stringify({ op: "canonical", value: { b: 1, a: 2 } }))); if (r.ok !== "{\"a\":2,\"b\":1}") process.exit(1); console.log("pkg/node", m.version(), "ok")'
          npm pack --dry-run --ignore-scripts
