[package]
name = "secure-net-core"
version = "0.7.0"
description = "Secure Net in Rust: canonical JSON, signed records and end-to-end sessions, checked against the JavaScript reference's test vectors."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ed25519-dalek = { version = "3", features = ["rand_core"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
ml-kem = { version = "0.3", features = ["hazmat"] }
ml-dsa = "0.1"
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
aes-gcm = "0.11"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "sha256", "pkcs8", "arithmetic", "std", "oprf"] }
sha3 = "0.12"
shake = "0.1"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }
zeroize = "1"
ed25519-zebra = { version = "5", default-features = false, features = ["std"] }
voprf = { version = "=0.6.0-pre.2", default-features = false, features = ["alloc"] }
openmls = { version = "0.9.2", default-features = false, features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { version = "0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
tls_codec = { version = "0.4", features = ["derive", "serde", "mls"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
# In browsers OpenMLS needs the clock and randomness from JavaScript ("js"); older RustCrypto
# crates under it use getrandom 0.2, which needs its own "js" switch.
openmls = { version = "0.9.2", default-features = false, features = ["draft-ietf-mls-pq-ciphersuites", "js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
hex = "0.4"
